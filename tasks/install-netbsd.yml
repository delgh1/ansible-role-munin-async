---
- name: Ensure munin-node is installed (NetBSD). daemonize is also needed.
  community.general.pkgin:
    name:
      - munin-node
      - daemonize
    state: present

- name: Create munin-async group on NetBSD.
  group:
    name: "{{ munin_async_user }}"
    system: true

- name: Create munin-async user on NetBSD.
  user:
    name: "{{ munin_async_user }}"
    system: true
    home: "{{ munin_async_home }}"
    group: "{{ munin_async_user }}"

- name: Copy munin-async script.
  copy:
    src: munin-async/munin-async.netbsd
    dest: "{{ munin_async_clientbin }}"
    mode: 0755

- name: Copy munin-asyncd script.
  copy:
    src: munin-async/munin-asyncd.netbsd
    dest: "{{ munin_async_clientbin }}d"
    mode: 0755

- name: Copy munin-asyncd init script.
  copy:
    src: munin-async/munin-asyncd.netbsdinit
    dest: "{{ munin_asyncd_initscript }}"
    mode: 0755
